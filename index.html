<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punch Counter - Peak Edge Detection</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px 0; min-height: 100vh; margin: 0; background: #f0f2f5; color: #1c1e21; }
        .container { text-align: center; background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 90%; max-width: 420px; margin-bottom: 20px; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
        .stat-box { background: #f8f9fa; padding: 1rem; border-radius: 12px; }
        .label { font-size: 0.8rem; color: #65676b; margin-bottom: 0.5rem; }
        .value { font-size: 1.8rem; font-weight: 800; color: #007AFF; }
        .timer-presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 1.5rem; }
        .preset-btn { padding: 8px; font-size: 0.8rem; border: 1.5px solid #e4e6eb; border-radius: 8px; background: white; cursor: pointer; color: #65676b; }
        .preset-btn.active { border-color: #007AFF; color: #007AFF; background: #e7f3ff; font-weight: bold; }
        .visualizer-container { margin: 1.5rem 0; }
        .meter-bar { width: 100%; height: 20px; background: #e4e6eb; border-radius: 10px; overflow: hidden; position: relative; }
        #volumeLevel { height: 100%; width: 0%; background: #34c759; transition: width 0.03s; }
        #thresholdLine { position: absolute; top: 0; bottom: 0; width: 2px; background: #ff3b30; z-index: 2; }
        .slider-group { text-align: left; margin-bottom: 1rem; }
        .slider-label { font-size: 0.75rem; color: #65676b; display: flex; justify-content: space-between; }
        input[type="range"] { width: 100%; margin: 5px 0 15px 0; accent-color: #007AFF; }
        button.main-btn { width: 100%; padding: 1rem; font-size: 1.1rem; font-weight: 600; cursor: pointer; border: none; border-radius: 12px; background: #007AFF; color: white; margin-bottom: 0.5rem; }
        .history-container { width: 90%; max-width: 420px; background: white; border-radius: 20px; padding: 1.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        td, th { padding: 8px 0; border-bottom: 1px solid #f0f2f5; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <div id="statusText" style="margin-bottom: 1rem; font-weight: 600; font-size: 0.9rem;">High-Speed Track Mode</div>
    <div class="timer-presets">
        <button class="preset-btn" data-time="5">5m</button>
        <button class="preset-btn" data-time="10">10m</button>
        <button class="preset-btn active" data-time="15">15m</button>
        <button class="preset-btn" data-time="30">30m</button>
    </div>
    
    <div class="stat-grid">
        <div class="stat-box" style="grid-column: span 2;"><div class="label">PUNCHES</div><div id="hitCount" class="value">0</div></div>
        <div class="stat-box"><div class="label">TIME</div><div id="timer" class="value">15:00</div></div>
        <div class="stat-box"><div class="label">KCAL</div><div id="calories" class="value">0.0</div></div>
    </div>

    <div class="visualizer-container">
        <div class="meter-bar">
            <div id="volumeLevel"></div>
            <div id="thresholdLine"></div>
        </div>
    </div>

    <div class="slider-group">
        <div class="slider-label"><span>타격 임계값</span><span id="v_thresh">35</span></div>
        <input type="range" id="thresholdSlider" min="5" max="100" value="35">
        
        <div class="slider-label"><span>타격 간격(쿨다운)</span><span id="v_cool">180ms</span></div>
        <input type="range" id="cooldownSlider" min="100" max="400" step="10" value="180">
    </div>

    <button id="startButton" class="main-btn">START</button>
</div>

<div class="history-container">
    <div style="font-weight:bold; margin-bottom:10px;">Workout History</div>
    <table>
        <tbody id="historyBody"></tbody>
    </table>
</div>

<script>
    let audioContext, analyser, microphone, javascriptNode, timerInterval;
    let hitCount = 0, isRunning = false, lastHitTime = 0;
    let targetMinutes = 15, remainingSeconds = 15 * 60;
    
    let threshold = 35;
    let cooldownPeriod = 180; 
    let previousAvg = 0; // 바로 이전 프레임의 소리 크기 저장
    let isMuting = false;

    const hitDisplay = document.getElementById('hitCount'), timerDisplay = document.getElementById('timer');
    const calorieDisplay = document.getElementById('calories'), startButton = document.getElementById('startButton');
    const volumeLevel = document.getElementById('volumeLevel'), historyBody = document.getElementById('historyBody');
    const threshLine = document.getElementById('thresholdLine');

    window.onload = loadHistory;

    document.getElementById('thresholdSlider').oninput = function() {
        threshold = parseInt(this.value);
        document.getElementById('v_thresh').innerText = threshold;
        threshLine.style.left = threshold + '%';
    };
    
    document.getElementById('cooldownSlider').oninput = function() {
        cooldownPeriod = parseInt(this.value);
        document.getElementById('v_cool').innerText = cooldownPeriod + 'ms';
    };

    threshLine.style.left = '35%';

    function playBell() {
        if (!audioContext) return;
        isMuting = true;
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.frequency.setValueAtTime(880, audioContext.currentTime);
        osc.frequency.exponentialRampToValueAtTime(660, audioContext.currentTime + 0.15);
        gain.gain.setValueAtTime(0, audioContext.currentTime);
        gain.gain.linearRampToValueAtTime(0.2, audioContext.currentTime + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
        osc.connect(gain); gain.connect(audioContext.destination);
        osc.start(); osc.stop(audioContext.currentTime + 0.3);
        setTimeout(() => { isMuting = false; }, 350);
    }

    async function setupAudio() {
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            analyser = audioContext.createAnalyser();
            microphone = audioContext.createMediaStreamSource(stream);
            javascriptNode = audioContext.createScriptProcessor(1024, 1, 1);
            analyser.fftSize = 256;
            microphone.connect(analyser); analyser.connect(javascriptNode); javascriptNode.connect(audioContext.destination);
            
            javascriptNode.onaudioprocess = () => {
                if (isMuting || !isRunning) return;

                const array = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(array);
                let avg = array.reduce((a, b) => a + b) / array.length;
                
                volumeLevel.style.width = Math.min(avg, 100) + '%';
                
                const now = Date.now();
                // 핵심 로직: 
                // 1. 임계값을 넘었고
                // 2. 마지막 타격 이후 쿨다운이 지났으며
                // 3. 소리가 상승하고 있는 '상승 엣지'인 경우 (avg > previousAvg + alpha)
                if (avg > threshold && (now - lastHitTime > cooldownPeriod)) {
                    if (avg > previousAvg + 2) { // 델타값(+2)을 주어 미세 진동 무시
                        hitCount++;
                        hitDisplay.innerText = hitCount;
                        lastHitTime = now;
                        
                        volumeLevel.style.background = '#ff3b30';
                        setTimeout(() => volumeLevel.style.background = '#34c759', 80);
                    }
                }
                
                previousAvg = avg; // 현재 값을 다음 연산을 위해 저장
            };
            return true;
        } catch (e) { alert('마이크 권한이 필요합니다.'); return false; }
    }

    function updateTimerDisplay() {
        timerDisplay.innerText = `${Math.floor(remainingSeconds/60).toString().padStart(2,'0')}:${(remainingSeconds%60).toString().padStart(2,'0')}`;
    }

    function saveWorkout() {
        const history = JSON.parse(localStorage.getItem('punchHistory') || '[]');
        history.unshift({ date: new Date().toLocaleDateString(), hits: hitCount, duration: targetMinutes, kcal: calorieDisplay.innerText });
        localStorage.setItem('punchHistory', JSON.stringify(history.slice(0, 5)));
        loadHistory();
    }

    function loadHistory() {
        const history = JSON.parse(localStorage.getItem('punchHistory') || '[]');
        historyBody.innerHTML = history.map(h => `<tr><td>${h.date}</td><td>${h.hits}회</td><td>${h.kcal} kcal</td></tr>`).join('');
    }

    startButton.addEventListener('click', async () => {
        if (!isRunning) {
            if (!audioContext) { if (!(await setupAudio())) return; } else audioContext.resume();
            if (remainingSeconds <= 0) { remainingSeconds = targetMinutes * 60; hitCount = 0; hitDisplay.innerText = '0'; }
            playBell();
            timerInterval = setInterval(() => {
                if (remainingSeconds > 0) {
                    remainingSeconds--; updateTimerDisplay();
                    calorieDisplay.innerText = ((8.0 * 3.5 * 70 / 200) * (targetMinutes - remainingSeconds / 60)).toFixed(1);
                } else { clearInterval(timerInterval); isRunning = false; startButton.innerText = '다시 시작'; playBell(); saveWorkout(); }
            }, 1000);
            startButton.innerText = 'PAUSE'; isRunning = true;
        } else { clearInterval(timerInterval); isRunning = false; startButton.innerText = 'RESUME'; }
    });
</script>
</body>
</html>
