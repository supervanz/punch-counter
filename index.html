<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Punch Counter</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f0f2f5; color: #1c1e21; }
        .container { text-align: center; background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 90%; max-width: 420px; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
        .stat-box { background: #f8f9fa; padding: 1rem; border-radius: 12px; }
        .label { font-size: 0.8rem; color: #65676b; margin-bottom: 0.5rem; }
        .value { font-size: 1.8rem; font-weight: 800; color: #007AFF; }
        
        .meter-container { margin: 1.5rem 0; text-align: left; }
        .meter-bar { width: 100%; height: 12px; background: #e4e6eb; border-radius: 6px; overflow: hidden; position: relative; }
        #volumeLevel { height: 100%; width: 0%; background: #34c759; transition: width 0.1s; }
        #thresholdLine { position: absolute; top: 0; bottom: 0; width: 2px; background: #ff3b30; z-index: 2; }
        
        .control-panel { margin-top: 1.5rem; border-top: 1px solid #e4e6eb; padding-top: 1.5rem; }
        .slider-box { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; }
        input[type="range"] { flex-grow: 1; accent-color: #007AFF; }
        
        button { width: 100%; padding: 1rem; font-size: 1.1rem; font-weight: 600; cursor: pointer; border: none; border-radius: 12px; background: #007AFF; color: white; margin-bottom: 0.5rem; }
        button#resetButton { background: #8e8e93; }
        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ccc; margin-right: 5px; }
        .status-active { background: #34c759; box-shadow: 0 0 8px #34c759; }
    </style>
</head>
<body>

<div class="container">
    <div style="margin-bottom: 1rem; font-weight: 600;">
        <span id="statusDot" class="status-dot"></span> <span id="statusText">대기 중</span>
    </div>
    
    <div class="stat-grid">
        <div class="stat-box" style="grid-column: span 2;">
            <div class="label">타격 횟수</div>
            <div id="hitCount" class="value">0</div>
        </div>
        <div class="stat-box">
            <div class="label">시간</div>
            <div id="timer" class="value">00:00</div>
        </div>
        <div class="stat-box">
            <div class="label">칼로리</div>
            <div id="calories" class="value">0.0</div>
        </div>
    </div>

    <div class="meter-container">
        <div class="label">입력 볼륨 및 임계값</div>
        <div class="meter-bar">
            <div id="volumeLevel"></div>
            <div id="thresholdLine" style="left: 50%;"></div>
        </div>
    </div>

    <div class="control-panel">
        <div class="slider-box">
            <div class="label" style="width: 60px;">민감도</div>
            <input type="range" id="thresholdSlider" min="10" max="150" value="60">
            <span id="thresholdValue" style="width: 30px; font-weight: bold;">60</span>
        </div>
        <button id="startButton">운동 시작</button>
        <button id="resetButton">초기화</button>
    </div>
</div>

<script>
    let audioContext, analyser, microphone, javascriptNode;
    let hitCount = 0;
    let startTime, timerInterval;
    let isRunning = false;
    let threshold = 60;
    const debounceTime = 250;
    let lastHitTime = 0;

    const hitDisplay = document.getElementById('hitCount');
    const timerDisplay = document.getElementById('timer');
    const calorieDisplay = document.getElementById('calories');
    const startButton = document.getElementById('startButton');
    const resetButton = document.getElementById('resetButton');
    const thresholdSlider = document.getElementById('thresholdSlider');
    const thresholdValue = document.getElementById('thresholdValue');
    const thresholdLine = document.getElementById('thresholdLine');
    const volumeLevel = document.getElementById('volumeLevel');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    thresholdSlider.oninput = function() {
        threshold = parseInt(this.value);
        thresholdValue.innerText = threshold;
        thresholdLine.style.left = `${(threshold / 150) * 100}%`;
    };

    async function setupAudio() {
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            analyser = audioContext.createAnalyser();
            microphone = audioContext.createMediaStreamSource(stream);
            javascriptNode = audioContext.createScriptProcessor(2048, 1, 1);

            analyser.fftSize = 256;
            microphone.connect(analyser);
            analyser.connect(javascriptNode);
            javascriptNode.connect(audioContext.destination);

            javascriptNode.onaudioprocess = () => {
                const array = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(array);
                let values = 0;
                for (let i = 0; i < array.length; i++) { values += array[i]; }
                const average = values / array.length;

                // 시각화 업데이트
                const volPercent = Math.min((average / 150) * 100, 100);
                volumeLevel.style.width = volPercent + '%';

                if (average > threshold && isRunning) {
                    const now = Date.now();
                    if (now - lastHitTime > debounceTime) {
                        hitCount++;
                        hitDisplay.innerText = hitCount;
                        lastHitTime = now;
                        volumeLevel.style.background = '#ff3b30';
                        setTimeout(() => { volumeLevel.style.background = '#34c759'; }, 100);
                    }
                }
            };
            return true;
        } catch (err) {
            alert('마이크 접근 권한이 필요합니다.');
            return false;
        }
    }

    function updateStats() {
        const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
        const mins = Math.floor(elapsedSeconds / 60).toString().padStart(2, '0');
        const secs = (elapsedSeconds % 60).toString().padStart(2, '0');
        timerDisplay.innerText = `${mins}:${secs}`;
        
        // MET 8.0, 70kg 기준 칼로리 계산
        const kcal = (8.0 * 3.5 * 70 / 200) * (elapsedSeconds / 60);
        calorieDisplay.innerText = kcal.toFixed(1);
    }

    startButton.addEventListener('click', async () => {
        if (!isRunning) {
            if (!audioContext) {
                const success = await setupAudio();
                if (!success) return;
            } else {
                audioContext.resume();
            }
            startTime = Date.now();
            timerInterval = setInterval(updateStats, 1000);
            startButton.innerText = '일시 정지';
            startButton.style.background = '#ff9500';
            statusDot.classList.add('status-active');
            statusText.innerText = '측정 중';
            isRunning = true;
        } else {
            clearInterval(timerInterval);
            startButton.innerText = '다시 시작';
            startButton.style.background = '#007AFF';
            statusDot.classList.remove('status-active');
            statusText.innerText = '일시 정지됨';
            isRunning = false;
        }
    });

    resetButton.addEventListener('click', () => {
        location.reload();
    });
</script>
</body>
</html>
