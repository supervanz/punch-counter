<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punch Counter with Persistence</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px 0; min-height: 100vh; margin: 0; background: #f0f2f5; color: #1c1e21; }
        .container { text-align: center; background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 90%; max-width: 420px; margin-bottom: 20px; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
        .stat-box { background: #f8f9fa; padding: 1rem; border-radius: 12px; }
        .label { font-size: 0.8rem; color: #65676b; margin-bottom: 0.5rem; }
        .value { font-size: 1.8rem; font-weight: 800; color: #007AFF; }
        .timer-presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 1.5rem; }
        .preset-btn { padding: 8px; font-size: 0.8rem; border: 1.5px solid #e4e6eb; border-radius: 8px; background: white; cursor: pointer; color: #65676b; }
        .preset-btn.active { border-color: #007AFF; color: #007AFF; background: #e7f3ff; font-weight: bold; }
        .meter-bar { width: 100%; height: 12px; background: #e4e6eb; border-radius: 6px; overflow: hidden; position: relative; margin: 10px 0; }
        #volumeLevel { height: 100%; width: 0%; background: #34c759; transition: width 0.1s; }
        #thresholdLine { position: absolute; top: 0; bottom: 0; width: 2px; background: #ff3b30; z-index: 2; }
        button.main-btn { width: 100%; padding: 1rem; font-size: 1.1rem; font-weight: 600; cursor: pointer; border: none; border-radius: 12px; background: #007AFF; color: white; margin-bottom: 0.5rem; }
        
        .history-container { width: 90%; max-width: 420px; background: white; border-radius: 20px; padding: 1.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .history-title { font-weight: bold; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { text-align: left; color: #65676b; border-bottom: 1px solid #e4e6eb; padding-bottom: 5px; }
        td { padding: 8px 0; border-bottom: 1px dotted #f0f2f5; }
        .clear-btn { font-size: 0.7rem; color: #ff3b30; cursor: pointer; border: 1px solid #ff3b30; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div id="statusText" style="margin-bottom: 1rem; font-weight: 600; font-size: 0.9rem;">Training Mode</div>
    <div class="timer-presets">
        <button class="preset-btn" data-time="5">5m</button>
        <button class="preset-btn" data-time="10">10m</button>
        <button class="preset-btn active" data-time="15">15m</button>
        <button class="preset-btn" data-time="30">30m</button>
    </div>
    <div class="stat-grid">
        <div class="stat-box" style="grid-column: span 2;"><div class="label">PUNCHES</div><div id="hitCount" class="value">0</div></div>
        <div class="stat-box"><div class="label">TIME</div><div id="timer" class="value">15:00</div></div>
        <div class="stat-box"><div class="label">KCAL</div><div id="calories" class="value">0.0</div></div>
    </div>
    <div class="meter-bar"><div id="volumeLevel"></div><div id="thresholdLine" style="left: 40%;"></div></div>
    <input type="range" id="thresholdSlider" min="10" max="150" value="60" style="width:100%; margin-bottom:1.5rem;">
    <button id="startButton" class="main-btn">START</button>
</div>

<div class="history-container">
    <div class="history-title">WORKOUT HISTORY <span class="clear-btn" onclick="clearHistory()">CLEAR</span></div>
    <table id="historyTable">
        <thead><tr><th>Date</th><th>Hits</th><th>Dur.</th><th>Kcal</th></tr></thead>
        <tbody id="historyBody"></tbody>
    </table>
</div>

<script>
    let audioContext, analyser, microphone, javascriptNode, timerInterval;
    let hitCount = 0, isRunning = false, threshold = 60, lastHitTime = 0;
    let targetMinutes = 15, remainingSeconds = 15 * 60;

    const hitDisplay = document.getElementById('hitCount'), timerDisplay = document.getElementById('timer');
    const calorieDisplay = document.getElementById('calories'), startButton = document.getElementById('startButton');
    const thresholdSlider = document.getElementById('thresholdSlider'), thresholdLine = document.getElementById('thresholdLine');
    const volumeLevel = document.getElementById('volumeLevel'), historyBody = document.getElementById('historyBody');

    window.onload = loadHistory;

    document.querySelectorAll('.preset-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            if (isRunning) return;
            document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            targetMinutes = parseInt(btn.dataset.time);
            remainingSeconds = targetMinutes * 60;
            updateTimerDisplay();
        });
    });

    thresholdSlider.oninput = function() {
        threshold = parseInt(this.value);
        thresholdLine.style.left = `${(threshold / 150) * 100}%`;
    };

    function playBell() {
        if (!audioContext) return;
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.frequency.setValueAtTime(880, audioContext.currentTime);
        osc.frequency.exponentialRampToValueAtTime(440, audioContext.currentTime + 0.5);
        gain.gain.setValueAtTime(0, audioContext.currentTime);
        gain.gain.linearRampToValueAtTime(0.4, audioContext.currentTime + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 1);
        osc.connect(gain); gain.connect(audioContext.destination);
        osc.start(); osc.stop(audioContext.currentTime + 1);
    }

    async function setupAudio() {
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            analyser = audioContext.createAnalyser();
            microphone = audioContext.createMediaStreamSource(stream);
            javascriptNode = audioContext.createScriptProcessor(2048, 1, 1);
            analyser.fftSize = 256;
            microphone.connect(analyser); analyser.connect(javascriptNode); javascriptNode.connect(audioContext.destination);
            javascriptNode.onaudioprocess = () => {
                const array = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(array);
                let avg = array.reduce((a, b) => a + b) / array.length;
                volumeLevel.style.width = Math.min((avg / 150) * 100, 100) + '%';
                if (avg > threshold && isRunning) {
                    const now = Date.now();
                    if (now - lastHitTime > 250) {
                        hitCount++; hitDisplay.innerText = hitCount; lastHitTime = now;
                        volumeLevel.style.background = '#ff3b30';
                        setTimeout(() => volumeLevel.style.background = '#34c759', 100);
                    }
                }
            };
            return true;
        } catch (e) { alert('Microphone access denied.'); return false; }
    }

    function updateTimerDisplay() {
        timerDisplay.innerText = `${Math.floor(remainingSeconds/60).toString().padStart(2,'0')}:${(remainingSeconds%60).toString().padStart(2,'0')}`;
    }

    function saveWorkout() {
        const history = JSON.parse(localStorage.getItem('punchHistory') || '[]');
        const workout = {
            date: new Date().toLocaleDateString(),
            hits: hitCount,
            duration: targetMinutes,
            kcal: calorieDisplay.innerText
        };
        history.unshift(workout);
        localStorage.setItem('punchHistory', JSON.stringify(history.slice(0, 10)));
        loadHistory();
    }

    function loadHistory() {
        const history = JSON.parse(localStorage.getItem('punchHistory') || '[]');
        historyBody.innerHTML = history.map(h => `<tr><td>${h.date}</td><td>${h.hits}</td><td>${h.duration}m</td><td>${h.kcal}</td></tr>`).join('');
    }

    function clearHistory() {
        if(confirm('Clear all history?')) { localStorage.removeItem('punchHistory'); loadHistory(); }
    }

    function stopWorkout(isFinished = false) {
        clearInterval(timerInterval); isRunning = false;
        startButton.innerText = 'RESTART';
        if (isFinished) { playBell(); saveWorkout(); }
    }

    startButton.addEventListener('click', async () => {
        if (!isRunning) {
            if (!audioContext) { if (!(await setupAudio())) return; } else audioContext.resume();
            if (remainingSeconds <= 0) { remainingSeconds = targetMinutes * 60; hitCount = 0; hitDisplay.innerText = '0'; }
            playBell();
            timerInterval = setInterval(() => {
                if (remainingSeconds > 0) {
                    remainingSeconds--; updateTimerDisplay();
                    calorieDisplay.innerText = ((8.0 * 3.5 * 70 / 200) * (targetMinutes - remainingSeconds / 60)).toFixed(1);
                } else { stopWorkout(true); }
            }, 1000);
            startButton.innerText = 'PAUSE'; isRunning = true;
        } else { stopWorkout(); }
    });
</script>
</body>
</html>
